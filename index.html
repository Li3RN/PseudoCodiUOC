<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Simulador i Validador de Pseudocodi</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
    h1 { font-size: 1.25rem; margin-bottom: 12px; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100vh - 100px); }
    .pane { display: flex; flex-direction: column; background: #1e293b; border-radius: 8px; border: 1px solid #334155; overflow: hidden; }
    .pane-header { padding: 10px 14px; background: #334155; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; }
    textarea { flex: 1; width: 100%; padding: 12px; background: #0f172a; color: #e2e8f0; border: none; font-family: "Fira Code", monospace; font-size: 0.9rem; resize: none; outline: none; line-height: 1.5; }
    .output { flex: 1; padding: 12px; background: #000; color: #4ade80; font-family: "Fira Code", monospace; font-size: 0.85rem; overflow-y: auto; white-space: pre-wrap; line-height: 1.4; }
    .error { color: #f87171; font-weight: bold; }
    .warning { color: #fbbf24; }
    .actions { display: flex; gap: 8px; }
    button { background: #0284c7; color: white; border: none; padding: 6px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .btn-clear { background: #475569; }
    .btn-clear:hover { background: #334155; }

    /* Modal personalitzat d'Entrada de Dades */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    .modal-title {
      color: #f8fafc;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      font-family: "Fira Code", monospace;
      word-break: break-word;
    }
    .modal-subtitle {
      color: #94a3b8;
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    .modal-input {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #38bdf8;
      font-family: "Fira Code", monospace;
      font-size: 1rem;
      outline: none;
      margin-bottom: 16px;
    }
    .modal-input:focus {
      border-color: #38bdf8;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <h1>
    <span>⚡ Simulador i Validador de Pseudocodi</span>
    <div class="actions">
      <button class="btn-clear" onclick="clearConsole()">Neteja consola</button>
      <button onclick="runInterpreter()">Valida i Executa ▶</button>
    </div>
  </h1>

  <div class="container">
    <div class="pane">
      <div class="pane-header">Editor de Pseudocodi</div>
      <textarea id="codeEditor" spellcheck="false">const
    L_TO_CC: real = 1000.0;
end const

algorithm volumeConversion
    var
        volume: integer;
    end var

    writeString("Input volume (in cc): ");
    volume := readInteger();

    writeString("The volume (in l) is: ");
    writeReal(integerToReal(volume) / L_TO_CC);
end algorithm</textarea>
    </div>

    <div class="pane">
      <div class="pane-header">Consola d'Execució i Errors</div>
      <div id="outputConsole" class="output">Prem "Valida i Executa" per comprovar l'algorisme.</div>
    </div>
  </div>

  <!-- Finestra modal interactiva d'entrada -->
  <div id="inputModal" class="modal-overlay">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title">Entrada de dades</div>
      <div id="modalSubtitle" class="modal-subtitle">Introdueix un valor per continuar</div>
      <input type="text" id="modalInput" class="modal-input" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn-clear" id="modalCancelBtn">Cancel·la</button>
        <button id="modalAcceptBtn">Accepta</button>
      </div>
    </div>
  </div>

  <script>
    const consoleEl = document.getElementById("outputConsole");

    function print(msg, className = "") {
      const span = document.createElement("span");
      if (className) span.className = className;
      span.textContent = msg;
      consoleEl.appendChild(span);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function println(msg = "", className = "") {
      print(msg + "\n", className);
    }

    function clearConsole() {
      consoleEl.innerHTML = "";
    }

    function demanarDada(titol, subtitol) {
      return new Promise((resolve) => {
        const modal = document.getElementById("inputModal");
        const titleEl = document.getElementById("modalTitle");
        const subEl = document.getElementById("modalSubtitle");
        const inputEl = document.getElementById("modalInput");
        const acceptBtn = document.getElementById("modalAcceptBtn");
        const cancelBtn = document.getElementById("modalCancelBtn");

        titleEl.textContent = titol;
        subEl.textContent = subtitol;
        inputEl.value = "";
        modal.style.display = "flex";
        setTimeout(() => inputEl.focus(), 50);

        function onAccept() {
          cleanup();
          resolve(inputEl.value);
        }

        function onCancel() {
          cleanup();
          resolve(null);
        }

        function onKeydown(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            onAccept();
          } else if (e.key === "Escape") {
            e.preventDefault();
            onCancel();
          }
        }

        function cleanup() {
          modal.style.display = "none";
          acceptBtn.removeEventListener("click", onAccept);
          cancelBtn.removeEventListener("click", onCancel);
          inputEl.removeEventListener("keydown", onKeydown);
        }

        acceptBtn.addEventListener("click", onAccept);
        cancelBtn.addEventListener("click", onCancel);
        inputEl.addEventListener("keydown", onKeydown);
      });
    }

    async function runInterpreter() {
      clearConsole();
      const code = document.getElementById("codeEditor").value;
      const lines = code.split("\n");

      println("─── 1. ANÀLISI I VALIDACIÓ ESTÀTICA ───", "warning");

      const symbols = {};
      let inConst = false;
      let inVar = false;
      let hasErrors = false;

      // 1. Passada de comprovació lèxica, sintàctica i de tipus
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].replace(/\{[^}]*\}/g, "").trim();
        const lineNum = i + 1;
        if (!line) continue;

        if (line.startsWith("const")) { inConst = true; continue; }
        if (line === "end const") { inConst = false; continue; }
        if (line.startsWith("var")) { inVar = true; continue; }
        if (line === "end var") { inVar = false; continue; }

        // Validació de constants
        if (inConst) {
          const match = line.match(/^([A-Z0-9_]+)\s*:\s*(integer|real|boolean|string|char)\s*=\s*(.+?);?$/);
          if (match) {
            const [_, name, type, rawVal] = match;
            const val = rawVal.replace(";", "").trim();
            if (type === "real" && !val.includes(".")) {
              println(`[Línia ${lineNum}] Error: La constant '${name}' està definida com a 'real' però no conté cap decimal (ex: .0).`, "error");
              hasErrors = true;
            }
            if (type === "integer" && val.includes(".")) {
              println(`[Línia ${lineNum}] Error: La constant '${name}' està definida com a 'integer' però conté decimals.`, "error");
              hasErrors = true;
            }
            symbols[name] = { type, value: type === "real" ? parseFloat(val) : (type === "integer" ? parseInt(val, 10) : val) };
          }
        }

        // Declaració de variables
        if (inVar) {
          const match = line.match(/^([a-zA-Z0-9_]+)\s*:\s*(integer|real|boolean|string|char);?$/);
          if (match) {
            const [_, name, type] = match;
            symbols[name] = { type, value: undefined };
          }
        }

        // Control de l'operador div i mod (només entre enters)
        if (/\b(div|mod)\b/.test(line)) {
          for (const [name, sym] of Object.entries(symbols)) {
            const regLeft = new RegExp(`\\b${name}\\s+(div|mod)\\b`);
            const regRight = new RegExp(`\\b(div|mod)\\s+${name}\\b`);
            if (sym.type === "real" && (regLeft.test(line) || regRight.test(line))) {
              println(`[Línia ${lineNum}] Error de tipus: '${name}' és de tipus real. Els operadors 'div' i 'mod' només admeten enters.`, "error");
              hasErrors = true;
            }
          }
          if (/integerToReal\([^)]+\)\s+(div|mod)/.test(line) || /(div|mod)\s+integerToReal\([^)]+\)/.test(line)) {
            println(`[Línia ${lineNum}] Error de tipus: 'integerToReal' retorna un real. Els operadors 'div' i 'mod' només admeten enters.`, "error");
            hasErrors = true;
          }
        }

        // Control de l'operador / (només entre reals)
        if (line.includes("/") && !line.includes("div")) {
          for (const [name, sym] of Object.entries(symbols)) {
            const regLeft = new RegExp(`\\b${name}\\s*\\/`);
            const regRight = new RegExp(`\\/\\s*${name}\\b`);
            if (sym.type === "integer" && (regLeft.test(line) || regRight.test(line))) {
              println(`[Línia ${lineNum}] Error de tipus: '${name}' és de tipus integer. L'operador '/' només admet reals. Fes servir 'div' o conversions.`, "error");
              hasErrors = true;
            }
          }
        }

        // Validació estricta de signatures: integerToReal
        const matchIntToReal = line.match(/integerToReal\s*\(\s*([a-zA-Z0-9_]+)\s*\)/);
        if (matchIntToReal) {
          const argName = matchIntToReal[1];
          if (symbols[argName] && symbols[argName].type === "real") {
            println(`[Línia ${lineNum}] Error de tipus: 'integerToReal' espera un argument de tipus integer, però '${argName}' és de tipus real.`, "error");
            hasErrors = true;
          }
        }

        // Validació estricta de signatures: realToInteger
        const matchRealToInt = line.match(/realToInteger\s*\(\s*([a-zA-Z0-9_]+)\s*\)/);
        if (matchRealToInt) {
          const argName = matchRealToInt[1];
          if (symbols[argName] && symbols[argName].type === "integer") {
            println(`[Línia ${lineNum}] Error de tipus: 'realToInteger' espera un argument de tipus real, però '${argName}' és de tipus integer.`, "error");
            hasErrors = true;
          }
        }

        // Validació estricta de signatures: codeToChar
        if (/codeToChar\s*\(\s*['"][^'"]*['"]\s*\)/.test(line)) {
          println(`[Línia ${lineNum}] Error de tipus: 'codeToChar' espera un enter (codi ASCII), no pas un caràcter literal.`, "error");
          hasErrors = true;
        }

        // Validació estricta de signatures: charToCode
        if (/charToCode\s*\(\s*\d+\s*\)/.test(line)) {
          println(`[Línia ${lineNum}] Error de tipus: 'charToCode' espera un caràcter, no pas un enter.`, "error");
          hasErrors = true;
        }

        // Enumerats sense cometes
        if (line.includes("type") || line.includes("{")) {
          if (/=\s*\{\s*"[^"]+"\s*(,\s*"[^"]+"\s*)*\}/.test(line)) {
            println(`[Línia ${lineNum}] Error de sintaxi: Els elements dels tipus enumerats no porten cometes dobles.`, "error");
            hasErrors = true;
          }
        }
      }

      if (hasErrors) {
        println("\n❌ No es pot iniciar l'execució fins que es corregeixin els errors de validació.", "error");
        return;
      }

      println("✔ Validació de tipus superada amb èxit.", "warning");
      println("\n─── 2. SIMULACIÓ EN TEMPS D'EXECUCIÓ ───\n");

      // 2. Execució pas a pas interactiva
      let inBody = false;
      let lastPrintedPrompt = "";

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].replace(/\{[^}]*\}/g, "").trim();
        if (!line) continue;

        if (line.startsWith("algorithm")) { inBody = true; continue; }
        if (line === "end algorithm") { inBody = false; continue; }
        if (line.startsWith("var") || line === "end var") continue;
        if (line.startsWith("const") || line === "end const") continue;

        if (inBody) {
          // writeString(...)
          const matchWriteStr = line.match(/^writeString\s*\(\s*"([^"]*)"\s*\);?$/);
          if (matchWriteStr) {
            const txt = matchWriteStr[1];
            print(txt);
            lastPrintedPrompt = txt;
            continue;
          }

          // writeReal(...) o writeInteger(...) o writeBoolean(...)
          const matchWriteGeneric = line.match(/^write(Real|Integer|Boolean|Char)\s*\(\s*(.+)\s*\);?$/);
          if (matchWriteGeneric) {
            const expr = matchWriteGeneric[2];
            try {
              const res = evaluateExpr(expr, symbols);
              print(res.toString());
            } catch (err) {
              println("\n[Error d'execució]: " + err.message, "error");
              return;
            }
            continue;
          }

          // Assignacions d'entrada: volume := readInteger()
          const matchRead = line.match(/^([a-zA-Z0-9_]+)\s*:=\s*read(Integer|Real|Char|String|Boolean)\s*\(\s*\);?$/);
          if (matchRead) {
            const varName = matchRead[1];
            const readType = matchRead[2];

            // Títol del quadre flotant extret directament del writeString previ
            const dialogTitle = lastPrintedPrompt ? lastPrintedPrompt.trim() : `Entrada requerida per a '${varName}'`;
            const dialogSubtitle = `Variable '${varName}': s'espera un valor de tipus ${readType}`;

            const input = await demanarDada(dialogTitle, dialogSubtitle);

            if (input === null) {
              println("\n[Execució cancel·lada per l'usuari]", "error");
              return;
            }

            const trimmedInput = input.trim();

            // Validació estricta segons el tipus d'entrada esperat
            if (readType === "Integer") {
              if (!/^-?\d+$/.test(trimmedInput)) {
                println(`\n[Error de tipus]: El valor '${trimmedInput}' no és un enter vàlid per a readInteger(). S'ha rebut un real o text.`, "error");
                return;
              }
              symbols[varName].value = parseInt(trimmedInput, 10);
            } else if (readType === "Real") {
              if (isNaN(Number(trimmedInput)) || trimmedInput === "") {
                println(`\n[Error de tipus]: El valor '${trimmedInput}' no és un real vàlid per a readReal().`, "error");
                return;
              }
              symbols[varName].value = parseFloat(trimmedInput);
            } else if (readType === "Boolean") {
              const lower = trimmedInput.toLowerCase();
              if (lower !== "true" && lower !== "false") {
                println(`\n[Error de tipus]: readBoolean() només accepta 'true' o 'false'.`, "error");
                return;
              }
              symbols[varName].value = (lower === "true");
            } else {
              symbols[varName].value = input;
            }

            println(trimmedInput);
            lastPrintedPrompt = "";
            continue;
          }

          // Assignacions de càlcul
          const matchAssign = line.match(/^([a-zA-Z0-9_]+)\s*:=\s*(.+?);?$/);
          if (matchAssign) {
            const varName = matchAssign[1];
            const expr = matchAssign[2];
            try {
              symbols[varName].value = evaluateExpr(expr, symbols);
            } catch (err) {
              println("\n[Error d'execució]: " + err.message, "error");
              return;
            }
          }
        }
      }

      println("\n\n✔ Execució completada.");
    }

    function evaluateExpr(expr, symbols) {
      let jsExpr = expr;

      jsExpr = jsExpr.replace(/integerToReal\(([^)]+)\)/g, "Number($1)");
      jsExpr = jsExpr.replace(/realToInteger\(([^)]+)\)/g, "Math.trunc($1)");
      jsExpr = jsExpr.replace(/charToCode\('([^'])'\)/g, "('$1'.charCodeAt(0))");
      jsExpr = jsExpr.replace(/codeToChar\(([^)]+)\)/g, "String.fromCharCode($1)");

      jsExpr = jsExpr.replace(/\bdiv\b/g, "/");
      jsExpr = jsExpr.replace(/\bmod\b/g, "%");
      jsExpr = jsExpr.replace(/≠/g, "!=");
      jsExpr = jsExpr.replace(/≥/g, ">=");
      jsExpr = jsExpr.replace(/≤/g, "<=");
      jsExpr = jsExpr.replace(/\band\b/g, "&&");
      jsExpr = jsExpr.replace(/\bor\b/g, "||");
      jsExpr = jsExpr.replace(/\bnot\b/g, "!");

      for (const [name, data] of Object.entries(symbols)) {
        const regex = new RegExp(`\\b${name}\\b`, "g");
        if (data.value !== undefined) {
          jsExpr = jsExpr.replace(regex, data.value);
        }
      }

      const val = Function(`"use strict"; return (${jsExpr})`)();
      return (typeof val === "number" && expr.includes("div")) ? Math.trunc(val) : val;
    }
  </script>
</body>
</html>
